[package]
name = "katar"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
readme = "../README.md"

[dependencies]
paste = "1"
libm = { version = "0.2", default-features = false }
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
core_detect = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
pulp = "0.22"
fearless_simd = "1.3"
fearless_simd_macros = "0.1"

[[bench]]
name = "bench"
harness = false
